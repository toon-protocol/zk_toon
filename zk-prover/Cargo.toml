[package]
name = "zk-prover"
version = "0.1.0"
edition = "2021"
description = "Kimchi step prover for o1js circuits, on the vendored mina-rust"

[dependencies]
anyhow = "1"
ledger = { path = "../vendor/mina-rust/crates/ledger", package = "mina-tree" }
mina-curves = { git = "https://github.com/o1-labs/proof-systems", rev = "ab84160fa2c22290a8506a7742ac1378879fc386" }
serde_json = "1"

[dev-dependencies]
flate2 = "1"
