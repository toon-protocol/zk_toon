[package]
name = "zk-note"
version = "0.1.0"
edition = "2021"
description = "zk-note primitives: the hashes, nullifiers, anchors and period arithmetic the vault circuits check"

[dependencies]
ark-ec = "0.5"
ark-ff = "0.5"
mina-curves = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
mina-hasher = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
mina-poseidon = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
mina-signer = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }

[dev-dependencies]
o1-utils = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
