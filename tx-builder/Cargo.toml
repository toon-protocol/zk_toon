[package]
name = "zk-toon-tx-builder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client of the o1js transaction builder: proved vault transactions and request proofs"

[dependencies]
ark-ec = "0.5"
ark-ff = "0.5"
mina-curves = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
mina-signer = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false }
serde_json = "1"
zk-note = { path = "../zk-note" }
