name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    # `shell: bash` runs with pipefail, so a failing test isn't masked by `tee`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
      # Building mina-rust (zk-prover's ledger) from scratch is slow.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The transaction builder's Rust tests start the o1js builder, so its packages come first.
      - name: o1js install
        run: |
          cd o1js
          npm ci
      - name: Rust vectors
        run: |
          cargo test --workspace -- --nocapture 2>&1 | tee rust.log
          grep -E 'vector cases run: [1-9][0-9]*' rust.log
      # The JSON report feeds the proofs-on check below.
      - name: o1js vectors
        run: |
          cd o1js
          npm run typecheck
          npm test -- --reporter=default --reporter=json --outputFile=../o1js-report.json 2>&1 | tee ../o1js.log
          grep -E 'vector cases run: [1-9][0-9]*' ../o1js.log
      # The named proofs-on set (PROOFS_ON in o1js/src/proofs-on.ts): fails if any of its tests is
      # missing, skipped or failed.
      - name: Proofs-on set
        run: |
          cd o1js
          npm run proofs-on -- ../o1js-report.json
      # The published verification keys and vault code hash, rebuilt without o1js's key cache: the
      # two builds must be identical.
      - name: Verification keys
        run: |
          cd o1js
          npm run keys -- ../verification-keys.json
          npm run keys -- --no-cache ../verification-keys.rebuild.json
          cmp ../verification-keys.json ../verification-keys.rebuild.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-keys
          path: verification-keys.json
          if-no-files-found: error
