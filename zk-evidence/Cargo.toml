[package]
name = "zk-evidence"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The evidence file's byte format: records, framing, header and evidence hash. No file I/O."

[dependencies]
ark-ff = "0.5"
crc32c = "0.6"
mina-signer = { git = "https://github.com/o1-labs/proof-systems", rev = "ab84160fa2c22290a8506a7742ac1378879fc386", default-features = false }
serde_json = "1"
sha2 = "0.10"
zk-note = { path = "../zk-note" }

[dev-dependencies]
hex = "0.4"
